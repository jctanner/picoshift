apiVersion: config.openshift.io/v1
kind: Authentication
metadata:
  name: cluster
spec:
  type: IntegratedOAuth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:openshift:well-known-oauth
rules:
  - nonResourceURLs:
      - /.well-known/oauth-authorization-server
      - /.well-known/openid-configuration
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:openshift:well-known-oauth
subjects:
  - kind: Group
    name: system:unauthenticated
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: system:openshift:well-known-oauth
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: oauth.openshift.io/v1
kind: OAuthClient
metadata:
  name: openshift-challenging-client
redirectURIs:
  - https://oauth-openshift.apps.ocp-sim.test/oauth/token/implicit
grantMethod: auto
respondWithChallenges: true
---
apiVersion: oauth.openshift.io/v1
kind: OAuthClient
metadata:
  name: openshift-browser-client
redirectURIs:
  - https://oauth-openshift.apps.ocp-sim.test/oauth/token/display
grantMethod: auto
