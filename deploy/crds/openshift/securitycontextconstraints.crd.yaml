apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: securitycontextconstraints.security.openshift.io
spec:
  group: security.openshift.io
  names:
    kind: SecurityContextConstraints
    listKind: SecurityContextConstraintsList
    plural: securitycontextconstraints
    singular: securitycontextconstraints
    shortNames: [scc]
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Priv
          type: string
          jsonPath: .allowPrivilegedContainer
        - name: Caps
          type: string
          jsonPath: .allowedCapabilities
        - name: SELinux
          type: string
          jsonPath: .seLinuxContext.type
        - name: RunAsUser
          type: string
          jsonPath: .runAsUser.type
        - name: FSGroup
          type: string
          jsonPath: .fsGroup.type
        - name: SupGroup
          type: string
          jsonPath: .supplementalGroups.type
        - name: Priority
          type: string
          jsonPath: .priority
        - name: ReadOnlyRootFS
          type: string
          jsonPath: .readOnlyRootFilesystem
        - name: Volumes
          type: string
          jsonPath: .volumes
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
