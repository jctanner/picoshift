apiVersion: v1
kind: Namespace
metadata:
  name: seaweedfs
---
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-creds
  namespace: seaweedfs
type: Opaque
stringData:
  accesskey: "picoshift"
  secretkey: "picoshift-secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: seaweedfs
  labels:
    app: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
      - name: seaweedfs
        image: docker.io/chrislusf/seaweedfs:4.07
        imagePullPolicy: IfNotPresent
        args: ["mini", "-dir=/data", "-s3"]
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: seaweedfs-creds
              key: accesskey
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: seaweedfs-creds
              key: secretkey
        ports:
        - containerPort: 8333
          name: s3
          protocol: TCP
        - containerPort: 9333
          name: master
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 8333
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
  - name: s3
    port: 8333
    targetPort: 8333
  - name: master
    port: 9333
    targetPort: 9333
