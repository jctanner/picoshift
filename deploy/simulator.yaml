apiVersion: v1
kind: Namespace
metadata:
  name: ocp-sim
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ocp-sim
  namespace: ocp-sim
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ocp-sim
rules:
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses", "gateways", "httproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses/status", "gateways/status", "httproutes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["networking.istio.io"]
    resources: ["destinationrules"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["oauth.openshift.io"]
    resources: ["oauthclients"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["project.openshift.io"]
    resources: ["projects", "projects/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ocp-sim
subjects:
  - kind: ServiceAccount
    name: ocp-sim
    namespace: ocp-sim
roleRef:
  kind: ClusterRole
  name: ocp-sim
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ocp-sim
  namespace: ocp-sim
spec:
  selector:
    matchLabels:
      app: ocp-sim
  template:
    metadata:
      labels:
        app: ocp-sim
    spec:
      serviceAccountName: ocp-sim
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ocp-sim
          image: localhost/ocp-sim:latest
          imagePullPolicy: Never
          args: ["--proxy", "--proxy-port", "80"]
          ports:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
            - containerPort: 443
              hostPort: 443
              protocol: TCP
            - containerPort: 9443
              hostPort: 9443
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "ocp_sim=info,kube=warn"
