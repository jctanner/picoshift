apiVersion: v1
kind: Namespace
metadata:
  name: models-as-a-service
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/name: maas
    app.kubernetes.io/component: gateway
spec:
  gatewayClassName: data-science-gateway-class
  listeners:
    - name: http
      hostname: maas.apps.ocp-sim.test
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-postgres
  namespace: opendatahub
  labels:
    app: maas-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-postgres
  template:
    metadata:
      labels:
        app: maas-postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: maas
            - name: POSTGRES_PASSWORD
              value: maas
            - name: POSTGRES_DB
              value: maas
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "maas"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: maas-postgres
  namespace: opendatahub
  labels:
    app: maas-postgres
spec:
  selector:
    app: maas-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Secret
metadata:
  name: maas-db-config
  namespace: opendatahub
type: Opaque
stringData:
  DB_CONNECTION_URL: "postgresql://maas:maas@maas-postgres.opendatahub.svc.cluster.local:5432/maas?sslmode=disable"
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: Tenant
metadata:
  name: default-tenant
  namespace: models-as-a-service
spec: {}
